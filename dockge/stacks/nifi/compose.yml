version: '3.8'

services:
  nifi:
    image: apache/nifi:latest
    container_name: nifi
    # ports:
    #   - "8443:8443"
    restart: unless-stopped
    networks:
      - cloudflare-net
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=nifi.huyab.click"
      - "dockflare.service=http://nifi:8443"
      - "dockflare.access.group=admin-team"

networks:
  cloudflare-net:
    name: cloudflare-net
    external: true