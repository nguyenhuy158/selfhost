version: "2"
services:
  db:
    container_name: odoo16-db
    image: postgres:15
    user: root
    environment:
      - POSTGRES_USER=${ODOO_DB_USER}
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD}
      - POSTGRES_DB=postgres
    restart: always # run as a service
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    networks:
      - cloudflare-net
  odoo16:
    container_name: odoo16
    image: odoo:16
    # image: odoo
    user: root
    depends_on:
      - db
    ports:
      - 10016:8069
      - 20016:8072 # live chat
    tty: true
    # command: --
    command: odoo -i base
    environment:
      - HOST=db
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
      - PIP_BREAK_SYSTEM_PACKAGES=1
    volumes:
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
      - ./entrypoint.sh:/entrypoint.sh
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    restart: always # run as a service
    networks:
      - cloudflare-net
    labels:
      - dockflare.enable=true
      - dockflare.hostname=odoo16.huyab.click
      - dockflare.service=http://odoo16:8069
      - dockflare.access.group=admin-team
networks:
  cloudflare-net:
    name: cloudflare-net
    external: true
