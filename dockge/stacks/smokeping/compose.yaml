services:
  smokeping:
    image: lscr.io/linuxserver/smokeping
    container_name: smokeping
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /mnt/DATA1T/dockge/stacks/smokeping/config:/config
      - /mnt/DATA1T/dockge/stacks/smokeping/data:/data
    ports:
      - 8080:80
    restart: unless-stopped