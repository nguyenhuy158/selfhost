services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - JELLYFIN_PublishedServerUrl=http://192.168.0.5 #optional
    volumes:
      - ./library:/config
      # - /path/to/tvseries:/data/tvshows
      - ../stash/data:/data/movies
    ports:
      - 8096:8096
    #   - 8920:8920 #optional
    #   - 7359:7359/udp #optional
    #   - 1900:1900/udp #optional
    restart: unless-stopped
    # Transcode có thể ăn nhiều CPU -> để 4 nhân, hạ ưu tiên khi máy bận
    cpus: 4.0
    cpu_shares: 512
    mem_limit: 2g
    networks:
      - cloudflare-net
    labels:
      - dockflare.enable=true
      - dockflare.hostname=jellyfin.huyab.click
      - dockflare.service=http://jellyfin:8096
      - dockflare.access.group=admin-team
networks:
  cloudflare-net:
    name: cloudflare-net
    external: true
