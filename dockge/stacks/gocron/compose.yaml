services:
  gocron:
    image: ghcr.io/flohoss/gocron:latest
    restart: always
    container_name: gocron
    hostname: gocron
    volumes:
      - ./config/:/app/config/
    ports:
      - 8156:8156
    networks:
      - cloudflare-net
    labels:
      - dockflare.enable=true
      - dockflare.hostname=gocron.huyab.click
      - dockflare.service=http://gocron:8156
      - dockflare.access.group=admin-team
networks:
  cloudflare-net:
    name: cloudflare-net
    external: true
