services:
  boltdiy:
    image: ghcr.io/stackblitz-labs/bolt.diy:latest
    container_name: boltdiy
    # ports:
    #   - "5173:5173"
    env_file:
      - .env.local
    restart: unless-stopped
    networks:
      - cloudflare-net
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=boltdiy.huyab.click"
      - "dockflare.service=http://boltdiy:5173"
      - "dockflare.access.group=admin-team"

networks:
  cloudflare-net:
    name: cloudflare-net
    external: true