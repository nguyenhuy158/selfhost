version: '3.9'
services:
    slink:
        image: 'anirdev/slink:latest'
        environment:
            - STORAGE_PROVIDER=local
            - IMAGE_MAX_SIZE=15M
            - USER_APPROVAL_REQUIRED=false
            - TZ=UTC
            - 'ORIGIN=https://slink.huyab.click'
        volumes:
            - './slink/images:/app/slink/images'
            - './slink/var/data:/app/var/data'
        # ports:
        #     - '3113:3000'
        container_name: slink
        networks:
          - cloudflare-net
        labels:
          - "dockflare.enable=true"
          - "dockflare.hostname=slink.huyab.click"
          - "dockflare.service=http://slink:3000"
          - "dockflare.access.group=admin-team"

networks:
  cloudflare-net:
    name: cloudflare-net
    external: true
