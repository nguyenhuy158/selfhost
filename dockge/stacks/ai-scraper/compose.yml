services:
  ai-scraper:
    build: .
    container_name: ai-scraper
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql://${AISCRAPER_DB_USER}:${AISCRAPER_DB_PASSWORD}@db:5432/aiscraper_db
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - cloudflare-net
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=ai-scraper.huyab.click"
      - "dockflare.service=http://ai-scraper:8000"
      - "dockflare.access.group=admin-team"

  db:
    image: postgres:15-alpine
    container_name: aiscraper_db
    environment:
      - POSTGRES_USER=${AISCRAPER_DB_USER}
      - POSTGRES_PASSWORD=${AISCRAPER_DB_PASSWORD}
      - POSTGRES_DB=aiscraper_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AISCRAPER_DB_USER} -d aiscraper_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - cloudflare-net
      
volumes:
  postgres_data:

networks:
  cloudflare-net:
    name: cloudflare-net
    external: true