services:
  ghost:
    image: ghost
    container_name: ghost
    # ports:
    #   - "2368:2368"
    environment:
      - NODE_ENV=production
      - database__connection__filename=/var/lib/ghost/content/data/ghost.db
      - url=https://ghost.huyab.click
    volumes:
      - ./some-ghost-data:/var/lib/ghost/content
      - ./config.production.json:/var/lib/ghost/config.production.json
    restart: unless-stopped
    networks:
      - cloudflare-net
    labels:
      - dockflare.enable=true
      - dockflare.hostname=ghost.huyab.click
      - dockflare.service=http://ghost:2368
      - dockflare.access.group=admin-team
networks:
  cloudflare-net:
    name: cloudflare-net
    external: true
x-dockge:
  urls: []
