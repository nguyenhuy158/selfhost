x-shared-env: &shared-env
  DATABASE_URL: postgres://${CANINE_DB_USER}:${CANINE_DB_PASSWORD}@postgres:5432
  BOOT_MODE: local
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
  APP_HOST: http://localhost:${PORT:-3000}
  LOCAL_MODE_PASSWORDLESS: true
  REMAP_LOCALHOST: "host.docker.internal"
  ALLOWED_HOSTNAME: "*"

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-bookworm@sha256:878977a5fe8d75ba7eab7610e4cf7e0c8626a683d89b3f9da965b8ceba952a09
    environment:
      - POSTGRES_USER=${CANINE_DB_USER}
      - POSTGRES_PASSWORD=${CANINE_DB_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=canine_production,canine_development
    # ports:
    #   - "5432:5432"
    volumes:
      - "postgres-canine:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CANINE_DB_USER}"]
      interval: 30s
      retries: 5
      start_period: 20s
    networks:
      - cloudflare-net

  canine:
    restart: unless-stopped
    image: ghcr.io/caninehq/canine:latest
    # Overrides default command so things don't shut down after the process ends.
    # command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    # ports:
    #   - "${PORT:-3000}:${PORT:-3000}"
    #   - "3200:3200"
    environment:
      <<: *shared-env
      PORT: ${PORT:-3000}
      ACCOUNT_SIGN_IN_ONLY: "true"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - cloudflare-net
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=canine.huyab.click"
      - "dockflare.service=http://canine:3000"
      - "dockflare.access.group=admin-team"

  worker:
    restart: unless-stopped
    image: ghcr.io/caninehq/canine:latest
    command: bundle exec good_job start
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *shared-env
      LOCAL_MODE: "true"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - cloudflare-net

volumes:
  postgres-canine:


networks:
  cloudflare-net:
    name: cloudflare-net
    external: true