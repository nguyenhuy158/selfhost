version: "3.8"
services:
  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser
    volumes:
      - /:/srv
      - ./filebrowser/database:/database
      - ./filebrowser/config:/config
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    networks:
      - cloudflare-net
    labels:
      - dockflare.enable=true
      - dockflare.hostname=file.huyab.click
      - dockflare.service=http://filebrowser:80
      - dockflare.access.group=admin-team
    ports:
      - 8128:80
networks:
  cloudflare-net:
    name: cloudflare-net
    external: true
