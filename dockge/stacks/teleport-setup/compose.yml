# Teleport — cổng truy cập hạ tầng: SSH/Kubernetes/DB qua một cửa, đăng nhập
# SSO, chứng chỉ ngắn hạn thay cho key vĩnh viễn, ghi + quay lại phiên làm việc.
#
# Docs: https://github.com/gravitational/teleport
#
# Dùng image dựng sẵn, không build từ source. Trước đây thư mục này là clone
# của auyongjinyoo/teleport-setup (repo mẫu) — đã bỏ, chỉ giữ compose.
#
# ./teleport/config  cấu hình (teleport.yaml)
# ./teleport/data    state + khoá TLS, do container tạo, thuộc root.
# Cả hai bị .gitignore của repo chặn (**/config/**, **/data/**) — cố ý, đó là
# dữ liệu chạy chứ không phải cấu hình khai báo.

services:
  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:17.5.6
    container_name: teleport
    hostname: teleport.huyab.click
    volumes:
      - ./teleport/config:/etc/teleport
      - ./teleport/data:/var/lib/teleport
    ports:
      - "3025:3025"
      - "3080:3080"

    networks:
      - cloudflare-net
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=teleport.huyab.click"
      - "dockflare.service=http://teleport:3080"
      - "dockflare.access.group=admin-team"

networks:
  cloudflare-net:
    name: cloudflare-net
    external: true
