services:
  uptime-kuma:
    # image: louislam/uptime-kuma:1
    image: louislam/uptime-kuma
    container_name: uptime-kuma
    volumes:
      - ./data:/app/data
    # ports:
    #   - "3001:3001"
    restart: always
    networks:
      - cloudflare-net
    labels:
      - dockflare.enable=true
      - dockflare.hostname=uptime.huyab.click
      - dockflare.service=http://uptime-kuma:3001
      - dockflare.access.group=admin-team
networks:
  cloudflare-net:
    name: cloudflare-net
    external: true
x-dockge:
  urls:
    - https://uptime.huyab.click/
