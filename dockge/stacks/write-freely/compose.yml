version: "3"

services:
  bludit:
    image: bludit/docker:latest
    container_name: bludit
    # ports:
    #   - "8000:80"
    volumes:
      - ./bludit:/var/www/html
    restart: unless-stopped

    networks:
      - cloudflare-net
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=bludit.huyab.click"
      - "dockflare.service=http://bludit:80"
      - "dockflare.access.group=admin-team"

networks:
  cloudflare-net:
    name: cloudflare-net
    external: true